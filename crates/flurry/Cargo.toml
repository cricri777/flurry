[package]
name = "flurry"
version = "0.1.3"
edition = "2024"

[dependencies]
flurry-graph = { path = "../flurry-graph" }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
snowflake-jwt = "0.3.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.2.1"
unicode-width = "0.2.3"
uuid = { version = "1.29.2", features = ["v4"] }
catppuccin = "2.9.1"
