[package]
name = "flurry-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
libsqlite3-sys = { version = "0.40.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.154"
snowflake-api = "0.14.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }
